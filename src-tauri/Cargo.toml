[package]
name = "kaituoyishi-desktop"
version = "1.1.0"
description = "开拓轶事 Desktop Edition"
authors = ["KaiTuoYiShi"]
edition = "2021"

[lib]
name = "kaituoyishi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
 rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-updater = "2"
base64 = "0.22"
